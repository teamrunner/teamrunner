# Linux host networking: only Caddy exposes public ports; Python is loopback-only.
services:
  gateway:
    build: .
    network_mode: host
    env_file: gateway.env
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    volumes:
      - quotas:/data
  caddy:
    image: caddy:2
    network_mode: host
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:-demollm.teamrunner.ai}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  quotas:
  caddy_data:
  caddy_config:
