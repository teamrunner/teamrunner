[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teamrunner"
version = "0.0.6"
description = "The experimentation platform for agent organizations — run multi-agent orchestrations and factorial experiments entirely from text files."
readme = "README.md"
license = "GPL-3.0-or-later AND MIT-0"
# The engine is GPL; the examples, what `new` writes and the authoring guide are MIT-0 (D130)
license-files = ["LICENSE", "NOTICE", "LEGAL.md", "examples/LICENSE", "src/teamrunner/authoring/LICENSE", "src/teamrunner/ui/static/vendor/*LICENSE*"]
requires-python = ">=3.10,<3.15"
authors = [
    { name = "Kumar Muthuraman", email = "hello@teamrunner.ai" },
]
maintainers = [
    { name = "Serenity Partners LLC", email = "hello@teamrunner.ai" },
]
keywords = ["agents", "multi-agent", "llm", "experimentation", "orchestration", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ruamel.yaml>=0.18",
    "jsonschema>=4.21",
    "litellm>=1.106.6,<2",
    "pypdf>=4",
    "httpx>=0.27",
    "deno>=2.9.8",
    "mcp>=2.3,<3",
]

[project.scripts]
teamrunner = "teamrunner.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://teamrunner.ai"
Repository = "https://github.com/teamrunner/teamrunner"
Issues = "https://github.com/teamrunner/teamrunner/issues"
Changelog = "https://github.com/teamrunner/teamrunner/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/teamrunner"]

# The shipped examples (D116, D122) live once, at the top of the repository, and are
# packed into the install as teamrunner/examples, where `new --from <name>` finds them.
[tool.hatch.build.targets.wheel.force-include]
"examples" = "teamrunner/examples"
"LEGAL.md" = "teamrunner/LEGAL.md"
"LICENSE" = "teamrunner/ui/static/license.txt"

[tool.pytest.ini_options]
testpaths = ["tests"]
