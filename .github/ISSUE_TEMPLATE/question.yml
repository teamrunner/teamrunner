name: Question or idea
description: How do I…? Could TeamRunner…? Or anything else you noticed
body:
  - type: markdown
    attributes:
      value: |
        Questions and ideas are as welcome as bugs. Please never paste an API key.
  - type: textarea
    id: question
    attributes:
      label: Your question or idea
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TeamRunner version, if it matters
      placeholder: teamrunner 0.0.3
