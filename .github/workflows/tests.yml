name: Tests

# Every push and pull request: build the wheel, install it into a clean Python, and run the
# tests against the installed copy, on Linux, macOS and Windows, on the oldest and newest
# Python claimed. Then make a team from a shipped example and check it, as a new user would.
# No model is called and no key is needed.

on:
  push:
  pull_request:
  # The publishing workflow calls this one on the files it is about to publish
  workflow_call:
    inputs:
      dist:
        description: the name of an artifact holding the wheel to test, instead of building one
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Build the wheel
        if: inputs.dist == ''
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Take the wheel being published
        if: inputs.dist != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.dist }}
          path: dist

      - name: Install it
        shell: bash
        run: python -m pip install dist/*.whl pytest

      # src/ is never on the path, so the tests import the installed copy
      - name: Tests
        run: python -m pytest -q

      # From an empty folder, in PowerShell everywhere (so Windows gets its own shell),
      # stopping at the first command that fails
      - name: A new team from a shipped example
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          teamrunner --version
          teamrunner new debate --from multi_agent_debate
          teamrunner validate debate
          teamrunner explain debate
          teamrunner run debate --rehearse -m "Should cities ban cars from their centres?"
          teamrunner runs debate

      # The website's tutorial (teamrunner.ai/tutorial.html), replayed with this build:
      # a change that would break the tutorial fails here, before it is released
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: teamrunner/teamrunner.ai
          path: website
      - name: The website's tutorial
        run: python website/tests/test_tutorial.py website/tutorial.html
